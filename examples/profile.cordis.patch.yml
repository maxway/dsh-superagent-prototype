# Windows profile example (%USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml).
# Replace <user> before first start; see docs/006-deployment.md.
# For POSIX / WSL see profile.posix.cordis.patch.yml.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: C:\Users\<user>\.dsh\state\superagent
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# On Windows, point that CLI at the npm lark-cli .cmd shim or the package's Node entry.
# - id: dsh-superagent-feishu
#   disabled: false
# One Git Source is active at a time. Enable the GitLab plugin (GitHub is on by default) to configure
# and switch hosts in the panel; set dsh-superagent-github disabled: true to use only GitLab.
# - id: dsh-superagent-gitlab
#   disabled: false
# - id: dsh-superagent-github
#   disabled: false
